---
- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure the Asterisk jail
  ansible.builtin.template:
    src: asterisk.local.j2
    dest: /etc/fail2ban/jail.d/asterisk.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Enable fail2ban at boot and start it now
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started

# fail2ban takes a few seconds to load its jails after a restart. Waiting here
# turns a jail that cannot start (say, a missing log file) into a failed play
# instead of a silent gap in protection.
- name: Apply the jail configuration now
  ansible.builtin.meta: flush_handlers

- name: Wait for the Asterisk jail to come up
  ansible.builtin.command: fail2ban-client status asterisk
  register: fail2ban_jail
  until: fail2ban_jail.rc == 0
  retries: 15
  delay: 2
  changed_when: false
