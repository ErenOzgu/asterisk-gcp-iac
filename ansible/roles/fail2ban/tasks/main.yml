---
- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure the Asterisk jail
  ansible.builtin.template:
    src: asterisk.local.j2
    dest: /etc/fail2ban/jail.d/asterisk.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Enable fail2ban at boot and start it now
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
