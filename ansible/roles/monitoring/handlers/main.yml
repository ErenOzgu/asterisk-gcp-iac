---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart node_exporter
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    state: restarted

- name: Restart asterisk-exporter
  ansible.builtin.systemd:
    name: asterisk-exporter
    state: restarted
