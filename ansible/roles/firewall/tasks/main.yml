---
- name: Check the firewall settings
  ansible.builtin.assert:
    that:
      - firewall_ssh_sources | length > 0
      - firewall_sip_sources | length > 0
      - (firewall_ssh_sources + firewall_sip_sources + firewall_rtp_sources + firewall_monitoring_sources)
        | select('match', '^[0-9]{1,3}(\.[0-9]{1,3}){3}(/[0-9]{1,2})?$') | list | length
        == (firewall_ssh_sources + firewall_sip_sources + firewall_rtp_sources + firewall_monitoring_sources) | length
    fail_msg: >-
      firewall_ssh_sources and firewall_sip_sources must not be empty (an empty
      list would lock you out or make the PBX unreachable), and every entry must
      be an IPv4 address or CIDR range.
    quiet: true
  when: firewall_enabled

- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: firewall_enabled

# The ruleset only ever touches its own table, so the tables fail2ban and Docker
# create are left alone. nft -c checks the syntax before the file is installed.
- name: Install the host firewall rules
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/nft -c -f %s
  when: firewall_enabled
  notify: Reload nftables

- name: Enable the firewall at boot and start it now
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started
  when: firewall_enabled
